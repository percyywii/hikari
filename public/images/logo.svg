<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Radiant Anime Prismatic Gradient -->
    <linearGradient id="hikari-prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Warm Amber Core / Spark Gradient -->
    <linearGradient id="hikari-spark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="50%" stop-color="#FF9966" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="hikari-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00F2FE" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Prismatic Diamond / Octagonal Anime Frame -->
  <polygon points="50,4 85,18 96,50 85,82 50,96 15,82 4,50 15,18" 
           fill="#0A0C16" 
           stroke="url(#hikari-prism)" 
           stroke-width="2.5" 
           stroke-linejoin="round" />

  <!-- Inner Dynamic Hexagonal Halo -->
  <polygon points="50,12 80,30 80,70 50,88 20,70 20,30" 
           fill="none" 
           stroke="url(#hikari-prism)" 
           stroke-width="1.2" 
           stroke-dasharray="4 2" 
           opacity="0.55" />

  <!-- Four-Point Celestial Star (The Core 'Hikari' Light Star) -->
  <path d="M50,14 Q52,42 80,50 Q52,58 50,86 Q48,58 20,50 Q48,42 50,14 Z" 
        fill="url(#hikari-prism)" 
        filter="url(#hikari-glow)" />

  <!-- Secondary Diagonal Star Flare -->
  <path d="M50,28 Q51,46 72,50 Q51,54 50,72 Q49,54 28,50 Q49,46 50,28 Z" 
        fill="url(#hikari-spark)" 
        opacity="0.85" />

  <!-- Center Supernova Spark / Diamond Core -->
  <polygon points="50,40 57,50 50,60 43,50" 
           fill="#FFFFFF" 
           filter="url(#hikari-glow)" />

  <!-- Corner Shimmer Accents -->
  <circle cx="50" cy="8" r="1.8" fill="#00F2FE" filter="url(#hikari-glow)" />
  <circle cx="92" cy="50" r="1.8" fill="#38BDF8" filter="url(#hikari-glow)" />
  <circle cx="50" cy="92" r="1.8" fill="#C084FC" filter="url(#hikari-glow)" />
  <circle cx="8" cy="50" r="1.8" fill="#00F2FE" filter="url(#hikari-glow)" />
</svg>
